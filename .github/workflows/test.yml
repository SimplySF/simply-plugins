name: tests
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version: ['lts/*', 'lts/-1']
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: pnpm

      - uses: google/wireit@setup-github-actions-caching/v2
        continue-on-error: true

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run build

      - name: pnpm test
        run: pnpm test

  windows-unit-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        node_version: ['lts/*', 'lts/-1']
      fail-fast: false
    steps:
      - run: git config --system core.longpaths true

      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          cache: pnpm

      - uses: google/wireit@setup-github-actions-caching/v2
        continue-on-error: true

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm run build

      - name: Verify command and tool snapshots are committed
        run: git diff --exit-code -- "**/command-snapshot.json" "**/tool-snapshot.json"

      # Left uncapped, lerna runs a package per core and wireit runs each package's tsc, eslint,
      # vitest and ts-node tasks side by side, which starves the small Windows runner badly enough
      # that tests taking ~100ms locally hit the 30s vitest timeout.
      - name: pnpm test
        run: pnpm exec lerna run test --concurrency 2
        env:
          WIREIT_PARALLEL: 2
